<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>Enter the Code</h2>
            <input type="password" id="password-input" placeholder="Hint: Our anniversary (MMDD)">
            <button onclick="checkPassword()">Unlock</button>
            <p id="error-msg"></p>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <header>
            <h1>Us, Through Time.</h1> <p>A few moments that matter.</p> </header>

        <div class="timeline">
            <div class="container left">
                <div class="content">
                    <h2>Feb 14, 2024</h2> <p>The day we met at the coffee shop.</p> </div>
            </div>
            <div class="container right">
                <div class="content">
                    <h2>Aug 20, 2024</h2>
                    <p>Our first road trip to the mountains.</p>
                </div>
            </div>
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
